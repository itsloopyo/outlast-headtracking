;  Outlast - Head Tracking configuration
;  Lives next to OLGame.exe in Binaries/Win64/.

[General]
EnableOnStartup=1
Port=4242
DataFreshnessMs=500
;  Yaw mode: true = horizon-locked yaw (default), false = camera-local.
WorldSpaceYaw=1
;  Keep the game window centred on its monitor. Outlast centres it once,
;  while the splash movies play, and then resizes it for the menu without
;  moving it, which leaves it off centre for the rest of the session. A
;  window that fills the screen is left alone.
CenterWindow=1

[View]
;  Field of view in degrees, or 0 for the game's own. Outlast has no
;  field-of-view setting; this is the mod rendering the frame at a
;  different angle. It is applied as a ratio against the camera's
;  unzoomed angle, so raising the camcorder and running still change the
;  view by the same proportion they always did, and it changes the frame
;  only - what the game reaches for, and every script that asks it the
;  same question, keep the game's own answer.
FieldOfView=0

[Smoothing]
;  Smoothing 0.0 (responsive) - 1.0 (heavy). Covers rotation and position.
;  The value is picked per connection from the packet source address:
;  LocalSmoothing for a tracker sending to 127.0.0.1 on this PC,
;  RemoteSmoothing for a phone or other device on the network.
LocalSmoothing=0
RemoteSmoothing=0.15

[Position]
;  6DOF positional tracking. The pose is used at 1:1 - shape it in your tracker,
;  not here. The limits below are metres of head travel, not a sensitivity.
Enabled=1
LimitX=0.3
;  Vertical travel is clamped to [-LimitYDown, +LimitY]: how far the view
;  may rise and how far it may drop, as separate metre budgets.
LimitY=0.2
LimitYDown=0.2
LimitZ=0.4
LimitZBack=0.1

[Hotkeys]
;  Virtual-key codes. Defaults: End (toggle), Page Up (cycle tracking mode), Page Down (yaw mode).
;  Set one to 0 to leave that action unbound; its chord below still works.
Toggle=0x23
CycleMode=0x21
YawMode=0x22
;  Chord alternatives: Ctrl+Shift+Y (toggle), Ctrl+Shift+G (cycle tracking mode), Ctrl+Shift+H (yaw mode).
ChordToggle=1
ChordCycleMode=1
ChordYawMode=1

[Diagnostics]
;  Find the live camera record by scanning memory, and report what writes
;  and reads it. This is a diagnostic tool: a pass walks the whole
;  address space and sets a CPU watchpoint across every thread in the
;  game, and the findings go to HeadTracking.log. It is the one thing here
;  that still runs on a game build this mod does not recognise, because
;  that is what it is for. Leave it false otherwise.
CameraProbe=0
;  Report which light the game enables when the camcorder's night vision
;  goes on, and what it is pointed at. Diagnostic; leave it false.
LightProbe=0
;  Log the reticle target, camera position and screen offset once a second.
AimProbe=0
